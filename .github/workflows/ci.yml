name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Placeholders, not secrets — nothing in this scaffold actually calls
      # Supabase at build time. They only need to satisfy the Zod shape
      # check in src/lib/env.ts.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # typecheck must run before lint: it's what invokes `next typegen`,
      # and ESLint's type-aware rules need the generated `PageProps`/
      # `LayoutProps` route types to exist on a fresh checkout (.next/ is
      # gitignored). A page using a typed dynamic-route helper —
      # PageProps<'/items/[id]'> — is what first exposed this ordering gap;
      # see the PR that added it.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: UI smoke test
        run: npm run test:e2e
